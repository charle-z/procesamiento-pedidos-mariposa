name: Validación

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Probar catálogo
        working-directory: catalogo
        run: go test ./... && go vet ./...
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Probar worker
        working-directory: worker
        env:
          REDIS_INTEGRATION: 'true'
        run: mvn -B -ntp test
      - name: Validar Docker Compose
        run: docker compose config --quiet
